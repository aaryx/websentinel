# WebSentinel configuration example
timeout: 10
concurrency: 10
rate_limit: 0          # requests per second, 0 = unlimited
max_pages: 50
max_depth: 1
user_agent: "WebSentinel/1.0 (+authorized security assessment)"
follow_redirects: true
max_redirects: 5
max_body_bytes: 1048576
verify_tls: true
output_format: terminal
