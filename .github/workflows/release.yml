name: Attested release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    # Dispatch the existing version tag, not a mutable branch or arbitrary input.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag/version mismatch'
          PY
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip_audit --local --progress-spinner off
      - run: python -m ruff check websentinel tests scripts
      - run: python -m pytest -q -m "not online" --cov=websentinel --cov-branch --cov-fail-under=90
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install dist/*.whl
      - run: python scripts/release_smoke.py
      - run: python scripts/release_manifest.py dist
      - name: Attest exact candidate and evidence
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attested-release-candidate
          path: dist/*
          if-no-files-found: error
