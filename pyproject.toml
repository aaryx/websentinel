[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websentinel"
version = "1.0.0"
description = "Authorized-use, low-impact CLI web security scanner"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.scripts]
websentinel = "websentinel.cli:main"

[tool.setuptools.packages.find]
include = ["websentinel*"]
