[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websentinel"
version = "1.0.0"
description = "Authorized-use, low-impact CLI web security scanner"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.scripts]
websentinel = "websentinel.cli:main"

[tool.setuptools.packages.find]
include = ["websentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["online: checks requiring external schema/advisory services"]

[tool.coverage.run]
branch = true
source = ["websentinel"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
